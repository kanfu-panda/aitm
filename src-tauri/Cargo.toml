[package]
name = "aitm"
version = "1.3.1"
description = "AI Terminal — Rust + Tauri"
authors = ["kanfu-panda"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.85"
default-run = "aitm"

[lib]
name = "aitm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aitm"
path = "src/main.rs"

[[bin]]
name = "perf_assert"
path = "src/bin/perf_assert.rs"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["unstable"] }
tauri-plugin-log = "2.2"
tauri-plugin-notification = "2.0"
tauri-plugin-aptabase = "1.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
thiserror = "2.0"
# `log` feature 必须开：项目从未初始化 tracing subscriber，而日志输出走的是
# `tauri_plugin_log`（基于 log crate）。不开这个 feature，代码里 28 处
# `tracing::` 日志会被**全部静默丢弃**——真机排查 set_bounds 时才发现（v1.3.0）。
# 开启后 tracing 事件会自动转成 log record，由 tauri_plugin_log 按级别输出。
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"
sysinfo = "0.33"
portable-pty = "0.9"
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
toml = "0.8"
dirs = "5"
eventsource-stream = "0.2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
dotenvy = "0.15"
regex = "1"
once_cell = "1"
globset = "0.4"
time = { version = "0.3", features = ["macros", "formatting"] }
git2 = { version = "0.19", default-features = false }
tempfile = "3"
# v1.1.0 F5：目录树 fs 自动刷新。macOS 走 FSEvents 后端（notify 默认 recommended
# watcher），debouncer-full 把突发事件聚合成批次，避免大 repo 一次性刷屏。
notify = "6"
notify-debouncer-full = "0.3"
tauri-plugin-process = "2.3.1"

# macOS 原生 Dock 角标：直接走 AppKit NSDockTile.setBadgeLabel，绕开
# Tauri Window::setBadgeCount 在 macOS 的 bug（tauri#13905）。objc2 系列已由
# Tauri 间接引入，这里显式声明所需 feature。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication",
    "NSDockTile",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSString",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
bytes = "1"
wiremock = "0.6"

[[bench]]
name = "startup_time"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
